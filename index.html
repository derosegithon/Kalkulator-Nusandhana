<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator NUSANDHANA Rangka Atap Baja Ringan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --zinc:#E9EDEF;          /* latar galvalume */
    --panel:#FFFFFF;
    --ink:#1C2733;           /* baja biru gelap */
    --steel:#3A5670;         /* biru baja */
    --hot:#E8590C;           /* oranye baja panas */
    --line:#C9D2D8;
    --ok:#1E7F4F;
    --radius:10px;
    font-size:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Barlow',sans-serif;color:var(--ink);
    background:
      repeating-linear-gradient(90deg, rgba(58,86,112,.045) 0 1px, transparent 1px 72px),
      var(--zinc);
    min-height:100vh;padding:20px 14px 60px;
  }
  .wrap{max-width:860px;margin:0 auto}
  header{margin-bottom:18px;border-left:5px solid var(--hot);padding-left:14px}
  header h1{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;
    font-size:clamp(1.7rem,4.5vw,2.4rem);line-height:1.05;text-transform:uppercase;letter-spacing:.5px;
  }
  header p{color:var(--steel);font-size:.92rem;margin-top:4px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .card h2{
    font-family:'Barlow Condensed',sans-serif;font-weight:600;text-transform:uppercase;
    letter-spacing:1px;font-size:1.05rem;color:var(--steel);
    border-bottom:2px solid var(--zinc);padding-bottom:8px;margin-bottom:14px;
  }
  label{display:block;font-weight:600;font-size:.85rem;margin:12px 0 5px}
  label small{font-weight:400;color:#6b7a87}
  input,select{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:7px;
    font-family:'Barlow',sans-serif;font-size:1rem;background:#FBFCFD;color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--hot);outline-offset:1px;border-color:var(--hot)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  /* sketsa atap */
  .sketch{background:#F4F7F8;border:1px dashed var(--line);border-radius:8px;margin-top:14px;padding:8px}
  .sketch svg{display:block;width:100%;height:auto}

  button{
    width:100%;margin-top:18px;padding:13px;border:none;border-radius:8px;cursor:pointer;
    background:var(--hot);color:#fff;font-family:'Barlow Condensed',sans-serif;
    font-size:1.25rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;
    transition:transform .08s ease, background .15s;
  }
  button:hover{background:#c94a08}
  button:active{transform:scale(.985)}

  /* hasil */
  #hasil{display:none}
  .res-item{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:#FBFCFD}
  .res-item .tag{
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:.8rem;text-transform:uppercase;
    letter-spacing:1.2px;color:var(--hot);
  }
  .res-item .big{font-size:1.45rem;font-weight:700;margin:2px 0}
  .res-item .big span{font-size:.95rem;font-weight:500;color:var(--steel)}
  .res-item .spec{font-size:.86rem;color:#46535f;line-height:1.45}
  .luas-band{
    display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;
    background:var(--ink);color:#fff;border-radius:8px;padding:12px 16px;margin-bottom:12px;
  }
  .luas-band b{font-size:1.5rem;font-family:'Barlow Condensed',sans-serif}
  .luas-band small{color:#AFC2D2}
  ul.pendukung{list-style:none}
  ul.pendukung li{
    display:flex;justify-content:space-between;gap:10px;padding:8px 2px;
    border-bottom:1px dashed var(--line);font-size:.92rem;
  }
  ul.pendukung li:last-child{border-bottom:none}
  ul.pendukung li b{white-space:nowrap}
  .note{font-size:.8rem;color:#6b7a87;margin-top:12px;line-height:1.5}
  .note b{color:var(--steel)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kalkulator <span style="color:var(--hot)">NUSANDHANA</span><br>Rangka Atap Baja Ringan</h1>
    <p>Estimasi kebutuhan Kanal C75, Reng 30, penutup atap &amp; aksesoris &mdash; standar batang 6 meter</p>
  </header>

  <div class="grid">
    <!-- ============ INPUT ============ -->
    <div class="card">
      <h2>Data Atap</h2>

      <div class="row2">
        <div>
          <label>Panjang Bangunan <small>(m)</small></label>
          <input type="number" id="panjang" value="12" min="1" step="0.1">
        </div>
        <div>
          <label>Lebar Bangunan <small>(m)</small></label>
          <input type="number" id="lebar" value="8" min="1" step="0.1">
        </div>
      </div>

      <div class="row2">
        <div>
          <label>Kemiringan <small>(derajat)</small></label>
          <input type="number" id="derajat" value="30" min="5" max="60" step="1">
        </div>
        <div>
          <label>Overstek <small>(m / sisi)</small></label>
          <input type="number" id="overstek" value="0.6" min="0" step="0.1">
        </div>
      </div>

      <div class="row2">
        <div>
          <label>Jarak Antar Kuda-Kuda <small>(m)</small></label>
          <input type="number" id="jarakKuda" value="1.2" min="0.6" max="2" step="0.1">
        </div>
        <div>
          <label>Bentuk Rangka Kuda-Kuda</label>
          <select id="rangka">
            <option value="standar">Standar</option>
            <option value="kremona">Kremona</option>
          </select>
        </div>
      </div>

      <label>Bentuk Atap</label>
      <select id="bentuk">
        <option value="pelana">Pelana</option>
        <option value="setengah">1/2 Pelana (Sandar)</option>
        <option value="limas">Limas (Perisai)</option>
      </select>

      <label>Material Penutup Atap</label>
      <select id="material">
        <option value="metal_pasir">Genteng Metal Pasir</option>
        <option value="metal">Genteng Metal (Polos)</option>
        <option value="tanah_liat">Genteng Tanah Liat</option>
        <option value="spandek_pasir">Spandek Pasir</option>
        <option value="spandek_polos">Spandek Polos</option>
        <option value="bitumen">Atap Bitumen (Gelombang)</option>
        <option value="pvc">Atap PVC</option>
      </select>

      <div class="sketch">
        <svg id="svgAtap" viewBox="0 0 300 130" xmlns="http://www.w3.org/2000/svg" aria-label="Sketsa penampang atap"></svg>
      </div>

      <button onclick="hitung()">Hitung Kebutuhan</button>
    </div>

    <!-- ============ HASIL ============ -->
    <div class="card" id="hasil">
      <h2>Hasil Perhitungan</h2>

      <div class="luas-band">
        <div><small>LUAS AKHIR ATAP (BIDANG MIRING)</small><br><b id="rLuas">&ndash;</b></div>
        <div style="text-align:right"><small>Luas datar + overstek</small><br><span id="rLuasDatar">&ndash;</span></div>
      </div>

      <div class="res-item">
        <div class="tag">1 &middot; Kanal C75</div>
        <div class="big" id="rKanal">&ndash;</div>
        <div class="spec" id="rKanalSpec"></div>
      </div>

      <div class="res-item">
        <div class="tag">2 &middot; Reng 30</div>
        <div class="big" id="rReng">&ndash;</div>
        <div class="spec" id="rRengSpec"></div>
      </div>

      <div class="res-item">
        <div class="tag">3 &middot; Penutup Atap</div>
        <div class="big" id="rAtap">&ndash;</div>
        <div class="spec" id="rAtapSpec"></div>
      </div>

      <div class="res-item">
        <div class="tag">4 &middot; Material Pendukung</div>
        <ul class="pendukung" id="rPendukung"></ul>
      </div>

      <div class="note" id="rNote"></div>
    </div>
  </div>
</div>

<script>
/* ====================== DATA MATERIAL ====================== */
const MAT = {
  metal_pasir : {nama:'Genteng Metal Pasir', jarakReng:0.385, beban:'ringan (±7 kg/m²)',
    kanalTebal:'0,65 mm', kanalAZ:'AZ100', rengTebal:'0,40 mm', rengAZ:'AZ100',
    tipe:'lembar', efektif:0.62, deskripsi:'lembar 2×4 daun (efektif ±0,62 m²/lbr)', sekrupAtap:12},
  metal : {nama:'Genteng Metal Polos', jarakReng:0.385, beban:'ringan (±5 kg/m²)',
    kanalTebal:'0,60 – 0,65 mm', kanalAZ:'AZ70 – AZ100', rengTebal:'0,40 mm', rengAZ:'AZ70 – AZ100',
    tipe:'lembar', efektif:0.62, deskripsi:'lembar 2×4 daun (efektif ±0,62 m²/lbr)', sekrupAtap:12},
  tanah_liat : {nama:'Genteng Tanah Liat', jarakReng:0.265, beban:'berat (±40–45 kg/m²)',
    kanalTebal:'0,75 – 1,00 mm', kanalAZ:'AZ100', rengTebal:'0,45 mm', rengAZ:'AZ100',
    tipe:'buah', per_m2:25, deskripsi:'±25 bh/m² (plentong/kodok, interlock tanpa sekrup)', sekrupAtap:0},
  spandek_pasir : {nama:'Spandek Pasir', jarakReng:0.60, beban:'ringan (±6 kg/m²)',
    kanalTebal:'0,65 mm', kanalAZ:'AZ100', rengTebal:'0,40 mm', rengAZ:'AZ100',
    tipe:'lajur', lebarEfektif:1.00, deskripsi:'tebal 0,30 – 0,40 mm, lebar efektif ±1,00 m', sekrupAtap:8},
  spandek_polos : {nama:'Spandek Polos', jarakReng:0.60, beban:'ringan (±4–5 kg/m²)',
    kanalTebal:'0,60 – 0,65 mm', kanalAZ:'AZ70 – AZ100', rengTebal:'0,40 mm', rengAZ:'AZ70 – AZ100',
    tipe:'lajur', lebarEfektif:1.00, deskripsi:'tebal 0,25 – 0,40 mm, lebar efektif ±1,00 m', sekrupAtap:6},
  bitumen : {nama:'Atap Bitumen Gelombang', jarakReng:0.455, beban:'ringan (±6 kg/m²)',
    kanalTebal:'0,65 mm', kanalAZ:'AZ100', rengTebal:'0,40 mm', rengAZ:'AZ100',
    tipe:'lembar', efektif:1.56, deskripsi:'lembar 200×95 cm (efektif ±1,56 m²/lbr)', sekrupAtap:15},
  pvc : {nama:'Atap PVC', jarakReng:0.50, beban:'ringan (±4–5 kg/m²)',
    kanalTebal:'0,60 – 0,65 mm', kanalAZ:'AZ70 – AZ100', rengTebal:'0,40 mm', rengAZ:'AZ70 – AZ100',
    tipe:'lajur', lebarEfektif:0.80, deskripsi:'lebar efektif ±0,80 m (sesuaikan merek)', sekrupAtap:6},
};

const BATANG = 6; // panjang standar batang (m)
const fmt = (n,d=2)=> n.toLocaleString('id-ID',{minimumFractionDigits:0,maximumFractionDigits:d});

/* ====================== SKETSA SVG ====================== */
function gambarSketsa(){
  const deg = +document.getElementById('derajat').value || 30;
  const bentuk = document.getElementById('bentuk').value;
  const svg = document.getElementById('svgAtap');
  const rad = deg*Math.PI/180;
  const W=300, base=105, x0=40, x1=260, span=x1-x0;
  let h, el='';
  const wall = `<rect x="${x0+18}" y="${base}" width="${span-36}" height="16" fill="#C9D2D8"/>`;

  if(bentuk==='setengah'){
    h = Math.min(span*Math.tan(rad), 85);
    el = `<polygon points="${x0},${base} ${x1},${base} ${x1},${base-h}" fill="#3A5670" opacity=".15" stroke="#3A5670" stroke-width="2"/>
          <line x1="${x0}" y1="${base}" x2="${x1}" y2="${base-h}" stroke="#E8590C" stroke-width="3"/>`;
  } else {
    h = Math.min((span/2)*Math.tan(rad), 85);
    el = `<polygon points="${x0},${base} ${x1},${base} ${W/2},${base-h}" fill="#3A5670" opacity=".15" stroke="#3A5670" stroke-width="2"/>
          <line x1="${x0}" y1="${base}" x2="${W/2}" y2="${base-h}" stroke="#E8590C" stroke-width="3"/>
          <line x1="${x1}" y1="${base}" x2="${W/2}" y2="${base-h}" stroke="#E8590C" stroke-width="3"/>`;
    if(bentuk==='limas'){
      el += `<line x1="${x0+40}" y1="${base}" x2="${W/2-30}" y2="${base-h+6}" stroke="#3A5670" stroke-width="1.5" stroke-dasharray="4 3"/>
             <line x1="${x1-40}" y1="${base}" x2="${W/2+30}" y2="${base-h+6}" stroke="#3A5670" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    }
  }
  svg.innerHTML = wall + el +
    `<path d="M ${x0+34} ${base} A 34 34 0 0 0 ${x0+34*Math.cos(rad)} ${base-34*Math.sin(rad)}" fill="none" stroke="#1C2733" stroke-width="1.5"/>
     <text x="${x0+42}" y="${base-9}" font-family="Barlow Condensed" font-size="14" font-weight="600" fill="#1C2733">${deg}&#176;</text>`;
}
['derajat','bentuk'].forEach(id=>document.getElementById(id).addEventListener('input',gambarSketsa));
gambarSketsa();

/* ====================== PERHITUNGAN ====================== */
function hitung(){
  const P0 = +document.getElementById('panjang').value;
  const L0 = +document.getElementById('lebar').value;
  const deg = +document.getElementById('derajat').value;
  const ov = +document.getElementById('overstek').value || 0;
  const bentuk = document.getElementById('bentuk').value;
  const m = MAT[document.getElementById('material').value];

  if(!P0 || !L0 || !deg){ alert('Lengkapi panjang, lebar, dan kemiringan atap.'); return; }

  const rad = deg*Math.PI/180, cos = Math.cos(rad), tan = Math.tan(rad);
  // dimensi termasuk overstek (overstek di kedua sisi)
  const P = P0 + 2*ov;
  const L = L0 + 2*ov;
  const luasDatar = P*L;
  const luasMiring = luasDatar/cos;

  const jarakKuda = +document.getElementById('jarakKuda').value || 1.2;
  const rangka = document.getElementById('rangka').value;

  // ---------- Kanal C75 ----------
  // faktor dasar pemakaian kanal per m² bidang miring pada jarak kuda-kuda 1,2 m
  // standar = web sederhana ±4 m/m² | kremona = web diagonal penuh ±4,6 m/m²
  let fKanal = (rangka==='kremona' ? 4.6 : 4.0) * (1.2/jarakKuda);
  if(bentuk==='limas') fKanal *= 1.12; // tambahan jurai + waste potongan
  const kanalMeter = luasMiring * fKanal;
  const kanalBatang = Math.ceil(kanalMeter/BATANG);
  const jmlKudaKuda = Math.ceil(P/jarakKuda)+1;

  // ---------- Reng 30 ----------
  const wasteReng = bentuk==='limas' ? 0.10 : 0.05;
  const rengMeter = (luasMiring/m.jarakReng)*(1+wasteReng);
  const rengBatang = Math.ceil(rengMeter/BATANG);

  // ---------- Penutup Atap ----------
  let atapBig='', atapSpec='';
  const sisiMiring = bentuk==='setengah' ? L/cos : (L/2)/cos; // panjang sisi miring
  if(m.tipe==='lembar'){
    const lembar = Math.ceil((luasMiring/m.efektif)*1.05);
    atapBig = `${fmt(lembar)} <span>lembar</span>`;
    atapSpec = `${m.nama} &mdash; ${m.deskripsi}. Termasuk cadangan potongan ±5%.`;
  } else if(m.tipe==='buah'){
    const buah = Math.ceil(luasMiring*m.per_m2*1.05);
    atapBig = `${fmt(buah)} <span>buah</span>`;
    atapSpec = `${m.nama} &mdash; ${m.deskripsi}. Termasuk cadangan ±5%.`;
  } else { // lajur (spandek / pvc)
    if(bentuk==='limas'){
      const mLari = Math.ceil((luasMiring/m.lebarEfektif)*1.10);
      atapBig = `&plusmn; ${fmt(mLari)} <span>m lari</span>`;
      atapSpec = `${m.nama} &mdash; ${m.deskripsi}. Bentuk limas: waste potongan miring ±10% sudah dihitung. Panjang potongan maks. mengikuti sisi miring ±${fmt(sisiMiring)} m.`;
    } else {
      const sisi = bentuk==='setengah' ? 1 : 2;
      const lajurPerSisi = Math.ceil(P/m.lebarEfektif);
      const totalLembar = lajurPerSisi*sisi;
      atapBig = `${fmt(totalLembar)} <span>lembar @ ${fmt(sisiMiring)} m</span>`;
      atapSpec = `${m.nama} &mdash; ${m.deskripsi}. ${lajurPerSisi} lajur per sisi &times; ${sisi} sisi, panjang lembar = sisi miring ${fmt(sisiMiring)} m (&plusmn; ${fmt(totalLembar*sisiMiring)} m lari total).`;
    }
  }

  // ---------- Pendukung ----------
  const sekrupTruss = Math.ceil(luasMiring*18/100)*100;            // sekrup 12-14×20 truss
  const sekrupAtap  = m.sekrupAtap ? Math.ceil(luasMiring*m.sekrupAtap/100)*100 : 0;
  const dynabolt = jmlKudaKuda*4;

  // panjang nok / bubungan
  let nokLen=0, nokLabel='Nok / bubungan';
  if(bentuk==='pelana'){ nokLen = P; }
  else if(bentuk==='setengah'){ nokLen = P; nokLabel='Flashing / nok pinggir atas'; }
  else { // limas: bubungan atas + 4 jurai
    const a=Math.max(P,L), b=Math.min(P,L);
    const ridge = a-b;
    const jurai = Math.sqrt( 2*Math.pow(b/2,2) + Math.pow((b/2)*tan,2) );
    nokLen = ridge + 4*jurai;
    nokLabel='Nok bubungan + nok jurai';
  }
  const nokPcs = Math.ceil((nokLen/0.8)*1.05); // efektif ±0,8 m/pcs

  let pendukung = [
    [nokLabel, `&plusmn; ${fmt(nokLen)} m (&plusmn;${fmt(nokPcs,0)} pcs efektif 0,8 m)`],
    ['Sekrup truss 12-14&times;20 (rangka)', `&plusmn; ${fmt(sekrupTruss,0)} pcs`],
  ];
  if(sekrupAtap) pendukung.push(['Sekrup atap 10-16&times;50 / baut roofing', `&plusmn; ${fmt(sekrupAtap,0)} pcs`]);
  else pendukung.push(['Sekrup atap', 'Tidak perlu (genteng interlock di reng)']);
  pendukung.push(['Dynabolt 10 &times; 77 mm (dudukan kuda-kuda)', `&plusmn; ${fmt(dynabolt,0)} pcs`]);
  pendukung.push([`Jumlah kuda-kuda (jarak ${fmt(jarakKuda)} m)`, `&plusmn; ${fmt(jmlKudaKuda,0)} unit`]);
  if(bentuk!=='setengah') pendukung.push(['Talang jurai (khusus limas) / lisplank', bentuk==='limas' ? 'Cek kebutuhan talang jurai dalam' : `Lisplank &plusmn; ${fmt(2*P+2*L)} m keliling`]);

  // ---------- Render ----------
  document.getElementById('hasil').style.display='block';
  document.getElementById('rLuas').innerHTML = `${fmt(luasMiring)} m&sup2;`;
  document.getElementById('rLuasDatar').innerHTML = `${fmt(luasDatar)} m&sup2; &middot; ${fmt(P)} &times; ${fmt(L)} m`;

  document.getElementById('rKanal').innerHTML = `${fmt(kanalBatang,0)} <span>batang @ 6 m</span>`;
  document.getElementById('rKanalSpec').innerHTML =
    `Kanal C75 &times; <b>${m.kanalTebal}</b>, lapisan <b>${m.kanalAZ}</b> &mdash; menyesuaikan beban atap ${m.beban}. `+
    `Rangka <b>${rangka==='kremona' ? 'Kremona (web diagonal penuh)' : 'Standar'}</b>, jarak kuda-kuda <b>${fmt(jarakKuda)} m</b>, `+
    `pemakaian &plusmn;${fmt(fKanal)} m/m&sup2; (kuda-kuda + web + ikatan angin)${bentuk==='limas' ? ', termasuk waste jurai' : ''}.`;

  document.getElementById('rReng').innerHTML = `${fmt(rengBatang,0)} <span>batang @ 6 m</span>`;
  document.getElementById('rRengSpec').innerHTML =
    `Reng 30 &times; <b>${m.rengTebal}</b>, lapisan <b>${m.rengAZ}</b> &mdash; jarak reng <b>${fmt(m.jarakReng*100,1)} cm</b> untuk ${m.nama}. Termasuk waste ${wasteReng*100}%.`;

  document.getElementById('rAtap').innerHTML = atapBig;
  document.getElementById('rAtapSpec').innerHTML = atapSpec;

  document.getElementById('rPendukung').innerHTML =
    pendukung.map(([k,v])=>`<li><span>${k}</span><b>${v}</b></li>`).join('');

  document.getElementById('rNote').innerHTML =
    `<b>Catatan:</b> Hasil di atas adalah estimasi kebutuhan material berdasarkan rumus praktis lapangan `+
    `(luas miring = luas datar &divide; cos ${deg}&deg;). Untuk genteng berat (tanah liat) wajib kanal min. 0,75 mm AZ100 `+
    `dan jarak kuda-kuda dirapatkan &plusmn;1,0&ndash;1,2 m. Verifikasi akhir tetap mengikuti gambar kerja / kondisi lapangan.`;

  if(window.innerWidth<720) document.getElementById('hasil').scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
